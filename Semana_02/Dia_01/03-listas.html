<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Document</title>
    <style>
        /*para poner CSS dentro de este HTML*/
        header{
            background-color: aqua;
            border: 1px solid purple;
        }

        main{

        }

        }

        body{

        }

                <li>Pescado</li>
                <li>Cebolla</li>
                <li>Camote</li>

        </section>
        <section>
            <ol>
                <li>Duro de matar</li>
                <li>El padrino</li>
                <li>Avatar</li>

</body>
</html>
